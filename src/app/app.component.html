<div class="relative mx-auto flex h-dvh max-w-[520px] flex-col overflow-hidden bg-bg text-ink sm:border-x sm:border-line">
  <router-outlet />

  <div class="absolute inset-0 z-30 transition-opacity duration-200"
       [class]="drawer.opened() ? 'bg-backdrop opacity-100' : 'pointer-events-none opacity-0'"
       (click)="drawer.close()"></div>

  <aside class="absolute inset-y-0 left-0 z-30 flex w-[280px] flex-col bg-surface pb-2 shadow-pop transition-transform duration-200 ease-out"
         [class]="drawer.opened() ? 'translate-x-0' : '-translate-x-full'"
         [attr.inert]="drawer.opened() ? null : ''">
    <div class="mb-2 flex items-center border-b border-line px-5 pb-[18px] pt-7">
      <span class="mr-3.5 flex size-[42px] items-center justify-center rounded-md bg-tint text-2xl text-green font-mdi">{{ logo }}</span>
      <span class="flex-1 text-2xl font-bold">{{ s.t().appName }}</span>
      <button type="button" class="flex size-10 items-center justify-center rounded-full text-2xl font-mdi transition-transform active:scale-90"
              [class]="isActive('/settings') ? 'bg-tint text-green' : 'text-muted'"
              [attr.aria-label]="s.t().settings.title" (click)="go('/settings')">{{ settingsIcon }}</button>
    </div>

    <nav class="flex-1 overflow-y-auto px-4 py-1">
      @for (item of items(); track item.url) {
        <button type="button"
                class="my-0.5 flex w-full items-center rounded-md py-[13px] pl-2.5 pr-3.5 text-left transition-transform active:scale-[0.98]"
                [class]="isActive(item.url) ? 'bg-tint text-green' : 'text-muted'"
                (click)="go(item.url)">
          <span class="mr-3.5 h-[22px] w-1 rounded-sm" [class]="isActive(item.url) ? 'bg-green' : 'bg-transparent'"></span>
          <span class="mr-4 text-[22px] font-mdi">{{ item.icon }}</span>
          <span class="text-base font-medium" [class]="isActive(item.url) ? '' : 'text-ink'">{{ item.label }}</span>
        </button>
      }
    </nav>
    @if (calendar.active()) {
      <button type="button" class="mx-4 mb-4 mt-2 flex items-center rounded-md border border-line bg-card px-3.5 py-3 text-left transition-transform active:scale-[0.98]"
              [attr.title]="calendar.status().message || s.t().calendar.title" (click)="onCalendarTap()">
        <span class="mr-3 text-xl font-mdi"
              [class]="calendar.status().state === 'error' ? 'text-bad' : calendar.status().state === 'offline' ? 'text-amber' : calendar.status().state === 'online' ? 'text-green' : 'text-muted'">{{ calendarIcon() }}</span>
        <span class="flex-1 text-sm font-medium text-muted" role="status">{{ s.t().calendar.states[calendar.status().state] }}</span>
      </button>
    }
  </aside>

  <app-dialog-host />
</div>
