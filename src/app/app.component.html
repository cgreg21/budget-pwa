<div #shell class="fixed inset-0 flex h-screen touch-pan-y flex-col overflow-hidden bg-bg text-ink md:flex-row"
     (pointerdown)="onDown($event)" (pointermove)="onMove($event)" (pointerup)="onUp($event)" (pointercancel)="onUp($event)">
  <router-outlet />

  @if (!drawerActive()) {
    <div #edge class="absolute inset-y-0 left-0 z-20 w-6 touch-none" aria-hidden="true"></div>
  }

  <div class="absolute inset-0 z-30 bg-backdrop md:hidden"
       [class]="dragging() ? '' : 'transition-opacity duration-200'"
       [class.pointer-events-none]="!drawer.opened() && !dragging()"
       [style.opacity]="backdropOpacity()"
       (click)="onBackdropClick()"></div>

  <aside class="absolute inset-y-0 left-0 z-30 flex w-[280px] shrink-0 touch-pan-y flex-col bg-surface pb-[calc(8px+env(safe-area-inset-bottom))] shadow-pop ease-out md:static md:order-first md:border-r md:border-line md:shadow-none"
         [class]="dragging() ? '' : 'transition-transform duration-200'"
         [style.transform]="layout.wide() ? null : 'translateX(' + drawerX() + 'px)'"
         [attr.inert]="drawerActive() ? null : ''">
    <div class="mb-2 flex items-center border-b border-line px-5 pb-[18px] pt-[calc(28px+env(safe-area-inset-top))]">
      <span class="mr-3.5 flex size-[42px] items-center justify-center rounded-md bg-tint text-2xl text-green font-mdi">{{ logo }}</span>
      <span class="flex-1 text-2xl font-bold">{{ s.t().appName }}</span>
      <button type="button" class="flex size-10 items-center justify-center rounded-full text-2xl font-mdi transition-transform active:scale-90"
              [class]="isActive('/settings') ? 'bg-tint text-green' : 'text-muted'"
              [attr.aria-label]="s.t().settings.title" (click)="go('/settings')">{{ settingsIcon }}</button>
    </div>

    <nav class="flex-1 overflow-y-auto px-4 py-1">
      @for (item of items(); track item.url) {
        <button type="button"
                class="my-0.5 flex w-full items-center rounded-md py-[13px] pl-2.5 pr-3.5 text-left transition-transform active:scale-[0.98]"
                [class]="isActive(item.url) ? 'bg-tint text-green' : 'text-muted'"
                (click)="go(item.url)">
          <span class="mr-3.5 h-[22px] w-1 rounded-sm" [class]="isActive(item.url) ? 'bg-green' : 'bg-transparent'"></span>
          <span class="mr-4 text-[22px] font-mdi">{{ item.icon }}</span>
          <span class="text-base font-medium" [class]="isActive(item.url) ? '' : 'text-ink'">{{ item.label }}</span>
        </button>
      }
    </nav>
    @if (calendar.active()) {
      <button type="button" class="mx-4 mb-4 mt-2 flex items-center rounded-md border border-line bg-card px-3.5 py-3 text-left transition-transform active:scale-[0.98]"
              [attr.title]="calendar.status().message || s.t().calendar.title" (click)="onCalendarTap()">
        <span class="mr-3 text-xl font-mdi"
              [class]="calendar.status().state === 'error' ? 'text-bad' : calendar.status().state === 'offline' ? 'text-amber' : calendar.status().state === 'online' ? 'text-green' : 'text-muted'">{{ calendarIcon() }}</span>
        <span class="flex-1 text-sm font-medium text-muted" role="status">{{ s.t().calendar.states[calendar.status().state] }}</span>
      </button>
    }
    <div class="px-5 text-xs text-muted" data-testid="app-version">v{{ version }}</div>
  </aside>

  @if (install.banner()) {
    <div class="absolute inset-x-3 bottom-[calc(12px+env(safe-area-inset-bottom))] z-20 flex items-center gap-3 rounded-md border border-line bg-card p-3 shadow-pop md:left-auto md:right-6 md:w-[440px]" role="dialog" [attr.aria-label]="s.t().install.title">
      <img src="icons/icon-192.png" alt="" class="size-11 shrink-0 rounded-md">
      <div class="min-w-0 flex-1">
        <div class="text-sm font-bold">{{ s.t().install.title }}</div>
        <div class="text-xs text-muted">{{ s.t().install.body }}</div>
      </div>
      <div class="flex shrink-0 flex-col gap-1">
        <button type="button" class="rounded-md bg-green px-3 py-1.5 text-sm font-bold text-bg transition-transform active:scale-95" (click)="install.install()">{{ s.t().install.install }}</button>
        <button type="button" class="rounded-md px-3 py-1.5 text-sm font-medium text-muted transition-transform active:scale-95" (click)="install.dismiss()">{{ s.t().install.dismiss }}</button>
      </div>
    </div>
  }

  <app-dialog-host />
</div>
