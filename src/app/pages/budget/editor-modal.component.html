<app-sheet [full]="true" (dismiss)="closed.emit()">
  <h2 class="modal-title">{{ existing ? s.t().editor.editTitle : s.t().editor.newTitle }}</h2>

  <div class="min-h-0 flex-1 overflow-y-auto">
    <div class="grid grid-cols-2">
      <button type="button" class="chip" [class.chip-active]="kind() === 'expense'" (click)="kind.set('expense')">{{ s.t().common.expense }}</button>
      <button type="button" class="chip" [class.chip-active]="kind() === 'income'" (click)="kind.set('income')">{{ s.t().common.income }}</button>
    </div>

    <label class="field-label" for="editor-amount">{{ s.t().editor.amount }}</label>
    <input id="editor-amount" class="input" type="text" inputmode="decimal" autocomplete="off"
           [placeholder]="s.formatInput(0)" [value]="amount()"
           (input)="amount.set($any($event.target).value)" (blur)="normalizeAmount()" />

    <label class="field-label" for="editor-date">{{ s.t().editor.date }}</label>
    <input id="editor-date" class="input" type="date" [value]="date()"
           (input)="date.set($any($event.target).value)" />

    <label class="field-label" for="editor-description">{{ s.t().editor.description }}</label>
    <input id="editor-description" class="input" type="text" autocomplete="off"
           [value]="description()" (input)="description.set($any($event.target).value)" />

    <span class="field-label">{{ s.t().editor.category }}</span>
    <button type="button" class="select" (click)="pickCategory()">
      <span class="mr-2.5 text-[22px] font-mdi">{{ categoryGlyph() }}</span>
      <span>{{ category() }}</span>
    </button>

    <div class="mt-3 flex items-center justify-between">
      <span class="text-base">{{ s.t().editor.repeat }}</span>
      <button type="button" role="switch" [attr.aria-checked]="repeat()"
              class="relative h-7 w-12 rounded-full transition-colors" [class]="repeat() ? 'bg-brand' : 'bg-line'"
              (click)="repeat.set(!repeat())">
        <span class="absolute top-0.5 size-6 rounded-full bg-white shadow transition-all" [class]="repeat() ? 'left-[22px]' : 'left-0.5'"></span>
      </button>
    </div>

    @if (repeat()) {
      <span class="field-label">{{ s.t().editor.frequency }}</span>
      <button type="button" class="select" (click)="pickFrequency()">{{ s.t().frequency[frequency()] }}</button>

      <div class="mt-3 flex items-center justify-between">
        <span class="mr-3 text-base">{{ s.t().editor.limited }}</span>
        <button type="button" role="switch" [attr.aria-checked]="limited()"
                class="relative h-7 w-12 shrink-0 rounded-full transition-colors" [class]="limited() ? 'bg-brand' : 'bg-line'"
                (click)="limited.set(!limited())">
          <span class="absolute top-0.5 size-6 rounded-full bg-white shadow transition-all" [class]="limited() ? 'left-[22px]' : 'left-0.5'"></span>
        </button>
      </div>

      @if (limited()) {
        <label class="field-label" for="editor-occurrences">{{ s.t().editor.occurrences }}</label>
        <input id="editor-occurrences" class="input" type="number" inputmode="numeric"
               [value]="occurrences()" (input)="occurrences.set($any($event.target).value)" />
      }
    }

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    @if (existing) {
      <button type="button" class="danger w-full" (click)="remove()">{{ s.t().common.delete }}</button>
    }
  </div>

  <div class="grid shrink-0 grid-cols-2">
    <button type="button" class="secondary" (click)="closed.emit()">{{ s.t().common.cancel }}</button>
    <button type="button" class="primary ml-2" (click)="save()">{{ s.t().common.save }}</button>
  </div>
</app-sheet>
