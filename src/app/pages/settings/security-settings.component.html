<span class="section-title">{{ s.t().lock.title }}</span>
<p class="row-sub">{{ s.t().lock.help }}</p>

@if (!lock.enabled()) {
  @if (mode() === 'none') {
    <button type="button" class="secondary w-full" (click)="open('set')">{{ s.t().lock.enable }}</button>
  }
} @else if (mode() === 'none') {
  <button type="button" class="secondary w-full" (click)="open('change')">{{ s.t().lock.change }}</button>
  @if (lock.biometricAvailable()) {
    <div class="setting">
      <span id="lock-biometric-label">{{ s.t().lock.biometric }}</span>
      <button type="button" role="switch" aria-labelledby="lock-biometric-label" [attr.aria-checked]="lock.biometricEnabled()"
              class="relative h-7 w-12 shrink-0 rounded-full transition-colors" [class]="lock.biometricEnabled() ? 'bg-brand' : 'bg-line'"
              (click)="toggleBiometric()">
        <span class="absolute top-0.5 size-6 rounded-full bg-white shadow transition-all" [class]="lock.biometricEnabled() ? 'left-[22px]' : 'left-0.5'"></span>
      </button>
    </div>
  }
  <button type="button" class="secondary w-full" (click)="lock.lock()">{{ s.t().lock.lockNow }}</button>
  <button type="button" class="secondary w-full" (click)="disable()">{{ s.t().lock.disable }}</button>
}

@if (mode() !== 'none') {
  <form (submit)="$event.preventDefault(); submit()">
    @if (mode() !== 'set') {
      <label class="field-label" for="lock-current">{{ s.t().lock.currentPin }}</label>
      <input id="lock-current" class="input" type="password" inputmode="numeric" autocomplete="off" [maxLength]="8"
             [value]="current()" (input)="current.set(digits($any($event.target).value))" />
    }
    <label class="field-label" for="lock-new">{{ s.t().lock.newPin }}</label>
    <input id="lock-new" class="input" type="password" inputmode="numeric" autocomplete="off" [maxLength]="8"
           [value]="pin()" (input)="pin.set(digits($any($event.target).value))" />
    <label class="field-label" for="lock-confirm">{{ s.t().lock.confirmPin }}</label>
    <input id="lock-confirm" class="input" type="password" inputmode="numeric" autocomplete="off" [maxLength]="8"
           [value]="confirm()" (input)="confirm.set(digits($any($event.target).value))" />
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    <button type="submit" class="primary w-full">{{ s.t().common.save }}</button>
    <button type="button" class="secondary w-full" (click)="open('none')">{{ s.t().selection.cancel }}</button>
  </form>
}
