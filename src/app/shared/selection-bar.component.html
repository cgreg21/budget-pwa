<div class="animate-slide-up relative z-10 flex items-center gap-1 border-t border-line bg-surface px-3 py-2 md:mx-2 md:rounded-md md:border" role="toolbar">
  <button type="button" class="flex size-11 items-center justify-center rounded-full text-[22px] text-ink font-mdi transition-transform active:scale-90"
          [attr.aria-label]="s.t().selection.cancel" [attr.title]="s.t().selection.cancel" (click)="cancel.emit()">{{ ui.close }}</button>
  <span class="min-w-0 flex-1 truncate text-sm font-bold" role="status">{{ s.t().selection.count(count()) }}</span>
  <button type="button" class="flex size-11 items-center justify-center rounded-full text-[22px] text-ink font-mdi transition-transform active:scale-90"
          [attr.aria-label]="s.t().selection.selectAll" [attr.title]="s.t().selection.selectAll" (click)="selectAll.emit()">{{ ui.selectAll }}</button>
  <ng-content />
</div>
