<div animate.leave="animate-fade-out" class="animate-fade fixed inset-0 z-[70] flex flex-col items-center justify-center bg-bg px-6 text-ink" role="dialog" aria-modal="true" [attr.aria-label]="s.t().lock.title">
  <span class="mb-4 text-5xl text-green font-mdi">{{ icons.lock }}</span>
  <h1 class="mb-6 text-xl font-bold">{{ s.t().appName }}</h1>
  <form class="flex w-full max-w-xs flex-col gap-3" (submit)="$event.preventDefault(); submit()">
    <input class="input text-center text-2xl tracking-[0.5em]" type="password" inputmode="numeric" autocomplete="off" autofocus
           [maxLength]="8" [attr.aria-label]="s.t().lock.currentPin" [value]="pin()" (input)="onInput($any($event.target))" />
    @if (error()) {
      <p class="error text-center" role="alert">{{ error() }}</p>
    }
    <button type="submit" class="primary w-full" [disabled]="busy() || pin().length < 4">{{ s.t().lock.unlock }}</button>
    @if (lock.biometricEnabled()) {
      <button type="button" class="secondary flex w-full items-center justify-center gap-2" (click)="useBiometric()">
        <span class="text-xl font-mdi">{{ icons.fingerprint }}</span>{{ s.t().lock.biometricUnlock }}
      </button>
    }
  </form>
</div>
