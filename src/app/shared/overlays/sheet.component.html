<div class="fixed inset-0 z-40 flex items-end justify-center bg-backdrop animate-fade-in wide:items-center wide:p-6" (click)="dismiss.emit()"
     [style.opacity]="backdropOpacity()" [style.transition]="dragging() ? 'none' : 'opacity 0.2s ease-out'">
  <div class="box-border flex w-full animate-sheet-in flex-col bg-surface wide:max-h-[88vh] wide:max-w-[560px] wide:rounded-3xl wide:shadow-pop"
       [class]="full() ? 'h-full px-4 pb-[calc(12px+env(safe-area-inset-bottom))] pt-[calc(12px+env(safe-area-inset-top))] wide:h-auto wide:px-6 wide:py-5' : 'max-h-full rounded-t-3xl px-4 pb-[calc(24px+env(safe-area-inset-bottom))] pt-3 wide:px-6 wide:pb-6 wide:pt-5'"
       [style.transform]="closing() ? 'translateY(100%)' : offset() > 0 ? 'translateY(' + offset() + 'px)' : null"
       [style.transition]="dragging() ? 'none' : 'transform 0.2s ease-out'"
       role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    @if (!full()) {
      <div class="-mt-3 flex h-8 shrink-0 touch-none items-center justify-center wide:-mt-5"
           (pointerdown)="onHandleDown($event)" (pointermove)="onHandleMove($event)"
           (pointerup)="onHandleUp($event)" (pointercancel)="onHandleCancel($event)">
        <div class="h-1 w-10 rounded-sm bg-line"></div>
      </div>
    }
    <ng-content />
  </div>
</div>
