@if (snackbar.current(); as message) {
  <div class="pointer-events-none absolute inset-x-3 bottom-[calc(80px+env(safe-area-inset-bottom))] z-50 flex justify-center md:bottom-6 md:left-auto md:right-6 md:justify-end">
    <div class="pointer-events-auto flex max-w-[480px] animate-appear items-center gap-3 rounded-md border bg-card py-2.5 pl-4 pr-2 shadow-pop"
         [class]="message.kind === 'error' ? 'border-bad' : message.kind === 'success' ? 'border-green' : 'border-line'"
         [attr.role]="message.kind === 'error' ? 'alert' : 'status'">
      <span class="min-w-0 flex-1 text-sm font-medium" [class]="message.kind === 'error' ? 'text-bad' : 'text-ink'">{{ message.text }}</span>
      @if (message.action; as action) {
        <button type="button" class="shrink-0 rounded-md px-3 py-1.5 text-sm font-bold text-green transition-transform active:scale-95"
                (click)="snackbar.runAction()">{{ action.label }}</button>
      }
      <button type="button" class="flex size-8 shrink-0 items-center justify-center rounded-full text-lg text-muted font-mdi"
              [attr.aria-label]="s.t().common.close" (click)="snackbar.dismiss()">{{ closeIcon }}</button>
    </div>
  </div>
}
