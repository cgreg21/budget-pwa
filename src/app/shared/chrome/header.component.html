<header class="flex items-center bg-bg px-3 py-2 short:py-1 pt-[calc(8px+env(safe-area-inset-top))] short:pt-[calc(4px+env(safe-area-inset-top))] wide:px-5">
  <button type="button" class="flex size-11 items-center justify-center rounded-full bg-card text-[22px] text-ink font-mdi transition-transform active:scale-90 wide:hidden"
          (click)="drawer.show()">{{ ui.menu }}</button>
  <h1 class="ml-3 flex-1 truncate text-[22px] font-bold wide:ml-0">{{ title() }}</h1>
  @if (selectLabel() !== null) {
    <button type="button"
            class="mr-2 flex size-11 items-center justify-center rounded-full text-[22px] font-mdi transition-transform active:scale-90"
            [class]="selecting() ? 'bg-brand text-on-brand' : 'bg-card text-ink'"
            [attr.aria-label]="selectLabel()" [attr.title]="selectLabel()" [attr.aria-pressed]="selecting()"
            (click)="selectTap.emit()">{{ ui.select }}</button>
  }
  @if (syncing() !== null) {
    <button type="button"
            class="mr-2 flex size-11 items-center justify-center rounded-full bg-card text-[22px] text-ink font-mdi transition-transform active:scale-90 disabled:opacity-50"
            [class.animate-spin]="syncing()" [disabled]="syncing()"
            [attr.aria-label]="syncLabel()"
            (click)="syncTap.emit()">{{ ui.syncing }}</button>
  }
  @if (filterActive() !== null) {
    <button type="button"
            class="flex size-11 items-center justify-center rounded-full text-[22px] font-mdi transition-transform active:scale-90"
            [class]="filterActive() ? 'bg-brand text-on-brand' : 'bg-card text-ink'"
            (click)="filtersTap.emit()">{{ ui.filters }}</button>
  }
  @if (actionLabel() !== null) {
    <button type="button"
            class="ml-2 flex size-11 items-center justify-center rounded-full bg-card text-[22px] text-bad font-mdi transition-transform active:scale-90"
            [attr.aria-label]="actionLabel()" [attr.title]="actionLabel()"
            (click)="actionTap.emit()">{{ actionIcon() }}</button>
  }
  @if (addLabel() !== null) {
    <button type="button"
            class="ml-2 flex size-11 items-center justify-center rounded-full bg-brand text-[22px] text-on-brand font-mdi transition-transform active:scale-90"
            [attr.aria-label]="addLabel()" [attr.title]="addLabel()"
            (click)="addTap.emit()">{{ ui.add }}</button>
  }
</header>
